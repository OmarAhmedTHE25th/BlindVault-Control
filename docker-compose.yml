services:
  redis:
    image: redis:7-alpine
    container_name: blindvault-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "no", "--save", ""]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  control:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: blindvault-control
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    environment:
      - BLINDVAULT_HOST=0.0.0.0
      - BLINDVAULT_PORT=8000
      - BLINDVAULT_UDP_HOST=0.0.0.0
      - BLINDVAULT_UDP_PORT=3478
      - BLINDVAULT_REDIS_URL=redis://redis:6379/0
      - BLINDVAULT_LOG_LEVEL=INFO
      - BLINDVAULT_SCRUB_IPS_IN_LOGS=true
    ports:
      - "8000:8000/tcp"
      - "3478:3478/udp"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/ready"]
      interval: 10s
      timeout: 5s
      retries: 3
